name: Generate plushie JSON files

on:
  push:
    branches:
      - "plush/**"

jobs:
  generate-json:
    name: Generate missing plushie JSON files
    runs-on: ubuntu-latest
    # Skip runs triggered by the bot's own auto-generated commit to prevent loops
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate missing JSON files
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          NAMESPACE="cloudie"
          TEXTURES_BASE="assets/${NAMESPACE}/textures/item/plushies"
          ITEMS_BASE="assets/${NAMESPACE}/items/plushies"
          MODELS_BASE="assets/${NAMESPACE}/models/item/plushies"

          # On the very first push to a branch, BEFORE is all zeros — fall back to find.
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            texture_paths=$(find "${TEXTURES_BASE}" -name "*.png" | sort)
          else
            texture_paths=$(git diff --name-only "$BEFORE" "$AFTER" | grep "^${TEXTURES_BASE}/.*\.png$" | sort)
          fi

          for texture_path in $texture_paths; do
            # Derive relative name (e.g. "character/boba_fett_slim" or "player/yann_wide")
            rel="${texture_path#${TEXTURES_BASE}/}"
            name="${rel%.png}"

            item_file="${ITEMS_BASE}/${name}.json"
            model_file="${MODELS_BASE}/${name}.json"

            # Determine parent model from suffix
            if [[ "$name" == *_slim ]]; then
              parent="${NAMESPACE}:item/plushies/player/default_slim"
            elif [[ "$name" == *_wide ]]; then
              parent="${NAMESPACE}:item/plushies/player/default_wide"
            else
              parent="${NAMESPACE}:item/plushies/player/default"
            fi

            texture_ref="${NAMESPACE}:item/plushies/${name}"

            # Create item definition if missing
            if [ ! -f "${item_file}" ]; then
              mkdir -p "$(dirname "${item_file}")"
              printf '{\n\t"model": {\n\t\t"type": "minecraft:model",\n\t\t"model": "%s:item/plushies/%s"\n\t}\n}\n' "${NAMESPACE}" "${name}" > "${item_file}"
              echo "Created item: ${item_file}"
            fi

            # Create model if missing
            if [ ! -f "${model_file}" ]; then
              mkdir -p "$(dirname "${model_file}")"
              printf '{\n  "parent": "%s",\n  "textures": {\n    "1": "%s",\n    "particle": "%s"\n  }\n}\n' "${parent}" "${texture_ref}" "${texture_ref}" > "${model_file}"
              echo "Created model: ${model_file}"
            fi
          done

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "No new files to commit."
          else
            git commit -m "Auto-generate missing plushie JSON files"
            git push
          fi
